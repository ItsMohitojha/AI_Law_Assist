<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyaya — Cinematic Transition Demo</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Framer Motion UMD CDN -->
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@11.1.7/dist/framer-motion.js"></script>

  <style>
    body {
      background-color: #0c0c14;
      margin: 0;
      overflow: hidden;
    }
    
    /* Smooth CSS fallback transitions in case Framer Motion UMD loads slowly */
    .css-transition-all {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Fallback Hover/Active states when timeline is idle */
    .btn-theme-idle {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
    }
    .btn-theme-idle:hover {
      transform: scale(1.06);
      box-shadow: 0 0 35px rgba(229, 193, 88, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.06);
    }
    .btn-theme-idle:active {
      transform: scale(0.93);
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // Extract motion objects from global FramerMotion UMD bundle
    const motion = window.FramerMotion ? window.FramerMotion.motion : null;
    const AnimatePresence = window.FramerMotion ? window.FramerMotion.AnimatePresence : null;

    // --- Fallback Animation Wrapper (in case CDN FramerMotion is blocked/fails) ---
    const FallbackMotionDiv = ({ children, className, animate, initial, transition, variants, ...props }) => {
      // If motion is loaded, use motion.div
      if (motion) {
        return (
          <motion.div
            className={className}
            animate={animate}
            initial={initial}
            transition={transition}
            variants={variants}
            {...props}
          >
            {children}
          </motion.div>
        );
      }
      // Fallback to regular div if Framer Motion UMD is not resolved
      return <div className={className} {...props}>{children}</div>;
    };

    const FallbackMotionButton = ({ children, className, animate, transition, ...props }) => {
      if (motion) {
        return (
          <motion.button
            className={className}
            animate={animate}
            transition={transition}
            {...props}
          >
            {children}
          </motion.button>
        );
      }
      return <button className={`${className} css-transition-all`} {...props}>{children}</button>;
    };

    // --- Canvas Particle System ---
    const ParticleBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const particles = [];
        const particleCount = 50;

        class Particle {
          constructor() {
            this.reset();
          }

          reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.size = Math.random() * 2 + 0.8;
            this.speedY = Math.random() * 0.35 + 0.15;
            this.speedX = Math.random() * 0.2 - 0.1;
            this.alpha = Math.random() * 0.45 + 0.1;
            this.angle = Math.random() * Math.PI * 2;
            this.spinSpeed = Math.random() * 0.02 - 0.01;
          }

          update() {
            this.y -= this.speedY;
            this.angle += this.spinSpeed;
            this.x += Math.sin(this.angle) * 0.15 + this.speedX;

            if (this.y < height * 0.1) {
              this.alpha -= 0.005;
            }

            if (this.y < 0 || this.alpha <= 0) {
              this.reset();
            }
          }

          draw() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(229, 193, 88, ${this.alpha})`;
            ctx.shadowColor = 'rgba(229, 193, 88, 0.3)';
            ctx.shadowBlur = 3;
            ctx.fill();
            ctx.restore();
          }
        }

        for (let i = 0; i < particleCount; i++) {
          const p = new Particle();
          p.y = Math.random() * height;
          particles.push(p);
        }

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const animate = () => {
          ctx.clearRect(0, 0, width, height);
          particles.forEach((p) => {
            p.update();
            p.draw();
          });
          animationFrameId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-0" />;
    };

    // --- Rotating Phrases for AI Textbox ---
    const ROTATING_PHRASES = [
      "Law at work.",
      "Ask away.",
      "Your legal AI assistant.",
      "Grounded in Indian law.",
      "Ask Nyaya anything."
    ];

    // --- Main Transition Component ---
    const CinematicTransition = ({ onComplete }) => {
      const [timelineState, setTimelineState] = useState('idle'); // 'idle' -> 'cursor-arriving' -> 'hovered' -> 'clicking' -> 'morphing' -> 'completed'
      const [typedText, setTypedText] = useState('');
      const [isDeleting, setIsDeleting] = useState(false);
      const [phraseIndex, setPhraseIndex] = useState(0);
      
      const [rippleActive, setRippleActive] = useState(false);
      const [buttonCompressed, setButtonCompressed] = useState(false);

      const handleClick = () => {
        if (timelineState !== 'idle') return;
        setRippleActive(true);
        setButtonCompressed(true);
        setTimelineState('clicking');
      };

      useEffect(() => {
        if (timelineState === 'clicking') {
          // Decompress and start Morphing after a short press interval
          const morphTimer = setTimeout(() => {
            setButtonCompressed(false);
            setTimelineState('morphing');
          }, 300);
          return () => clearTimeout(morphTimer);
        }

        if (timelineState === 'morphing') {
          // Complete morphing and unlock textbox
          const completeTimer = setTimeout(() => {
            setTimelineState('completed');
          }, 1400);
          return () => clearTimeout(completeTimer);
        }
      }, [timelineState]);

      // Typewriter Loop
      useEffect(() => {
        if (timelineState !== 'completed') return;

        let timer;
        const currentPhrase = ROTATING_PHRASES[phraseIndex];

        if (isDeleting) {
          timer = setTimeout(() => {
            setTypedText(currentPhrase.substring(0, typedText.length - 1));
          }, 40 + Math.random() * 20);
        } else {
          timer = setTimeout(() => {
            setTypedText(currentPhrase.substring(0, typedText.length + 1));
          }, 80 + Math.random() * 50);
        }

        if (!isDeleting && typedText === currentPhrase) {
          timer = setTimeout(() => setIsDeleting(true), 1600);
        } else if (isDeleting && typedText === '') {
          setIsDeleting(false);
          setPhraseIndex((prev) => (prev + 1) % ROTATING_PHRASES.length);
        }

        return () => clearTimeout(timer);
      }, [typedText, isDeleting, phraseIndex, timelineState]);

      // Responsive animation values for Logo Wrapper
      const logoAnimate = {
        left: (timelineState === 'morphing' || timelineState === 'completed') ? '-6px' : '50%',
        x: (timelineState === 'morphing' || timelineState === 'completed') ? '0%' : '-50%',
        y: '-50%',
        scale: (timelineState === 'morphing' || timelineState === 'completed')
          ? 0.45
          : buttonCompressed
          ? 0.93
          : timelineState === 'hovered'
          ? 1.06
          : 1
      };

      const logoTransition = {
        duration: 1.3,
        ease: [0.19, 1, 0.22, 1]
      };

      // Native fallback animation values if Framer Motion CDN is offline
      const fallbackLogoStyle = {
        left: (timelineState === 'morphing' || timelineState === 'completed') ? '-6px' : '50%',
        transform: `translate(${(timelineState === 'morphing' || timelineState === 'completed') ? '0' : '-50%'}, -50%) scale(${(timelineState === 'morphing' || timelineState === 'completed') ? 0.45 : buttonCompressed ? 0.93 : timelineState === 'hovered' ? 1.06 : 1})`,
        transition: 'left 1.3s cubic-bezier(0.19, 1, 0.22, 1), transform 1.3s cubic-bezier(0.19, 1, 0.22, 1)'
      };

      return (
        <div className="relative flex flex-col items-center justify-center w-full h-screen overflow-hidden bg-[#0a0a10]">
          {/* Particle Background */}
          <ParticleBackground />

          {/* Radial Ambient Gold/Blue glow lights */}
          <div className="absolute top-1/4 left-1/4 w-[35vw] h-[35vh] rounded-full bg-[radial-gradient(circle,rgba(229,193,88,0.06)_0%,rgba(0,0,0,0)_70%)] blur-3xl pointer-events-none" />
          <div className="absolute bottom-1/4 right-1/4 w-[45vw] h-[45vh] rounded-full bg-[radial-gradient(circle,rgba(65,161,207,0.08)_0%,rgba(0,0,0,0)_70%)] blur-3xl pointer-events-none" />

          {/* Central Container Stage */}
          <div className="relative flex items-center justify-center w-full max-w-4xl h-48 px-6">
            <div className="relative flex items-center justify-center w-full">
              
              {/* Logo Wrapper */}
              <FallbackMotionDiv
                initial={{ left: '50%', x: '-50%', y: '-50%', scale: 1 }}
                animate={logoAnimate}
                transition={logoTransition}
                style={fallbackLogoStyle}
                className="absolute z-30 css-transition-all top-1/2"
              >
                <FallbackMotionButton
                  whileHover={timelineState === 'idle' ? {
                    scale: 1.06,
                    boxShadow: '0 0 35px rgba(229,193,88,0.4), inset 0 0 20px rgba(255,255,255,0.06)'
                  } : undefined}
                  whileTap={timelineState === 'idle' ? { scale: 0.93 } : undefined}
                  animate={{
                    scale: buttonCompressed ? 0.93 : 1,
                    boxShadow: (timelineState === 'morphing' || timelineState === 'completed')
                      ? '0 5px 15px rgba(0,0,0,0.4)'
                      : '0 10px 30px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.03)'
                  }}
                  transition={{
                    scale: { duration: 0.1 },
                    boxShadow: { duration: 0.3 }
                  }}
                  onClick={handleClick}
                  className={`relative w-28 h-28 rounded-full bg-gradient-to-br from-[#1c1c28] to-[#0c0c14] border border-[#e5c158]/30 backdrop-blur-md flex items-center justify-center group overflow-hidden ${timelineState === 'idle' ? 'btn-theme-idle' : ''}`}
                >
                  {/* Shimmer overlay */}
                  <div className="absolute inset-0 bg-[linear-gradient(120deg,transparent_25%,rgba(255,255,255,0.05)_40%,rgba(255,255,255,0.08)_50%,rgba(255,255,255,0.05)_60%,transparent_75%)] -translate-x-[200%] group-hover:translate-x-[200%] transition-transform duration-1000 ease-out" />
                  
                  {/* Scales of Justice Icon */}
                  <svg className="w-12 h-12 text-[#e5c158]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 3v18M3 7l9-4 9 4M5.5 7l-2 7c0 1.7 1.7 3 3.5 3s3.5-1.3 3.5-3l-2-7M15.5 7l-2 7c0 1.7 1.7 3 3.5 3s3.5-1.3 3.5-3l-2-7M8 21h8" />
                  </svg>

                  {/* Circular click wave */}
                  {rippleActive && (
                    <span className="absolute inset-0 rounded-full border border-[#e5c158] animate-ping" style={{ animationDuration: '0.6s' }} />
                  )}
                </FallbackMotionButton>
              </FallbackMotionDiv>

              {/* Textbox Container */}
              {(timelineState === 'morphing' || timelineState === 'completed') && (
                <div
                  className="relative h-20 bg-gradient-to-r from-[#171722]/80 to-[#12121a]/85 border border-[#e5c158]/20 rounded-full backdrop-blur-xl shadow-[0_20px_50px_rgba(0,0,0,0.6)] flex items-center pl-28 pr-8 css-transition-all w-full"
                  style={{ animation: 'expandBox 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards' }}
                >
                  <style>{`
                    @keyframes expandBox {
                      from { width: 80px; opacity: 0; }
                      to { width: 100%; opacity: 1; }
                    }
                  `}</style>

                  {/* Gold Edge Top Lighting Highlight */}
                  <div className="absolute inset-0 rounded-full border border-t-[#e5c158]/15 border-b-transparent pointer-events-none" />

                  {/* Text Input Row */}
                  <div className="flex items-center w-full font-sans text-lg text-white/90 font-light select-none">
                    <span>{typedText}</span>
                    <span className="ml-1 w-[2px] h-5 bg-[#e5c158] animate-pulse" />
                  </div>

                  {/* Send CTA */}
                  <div className="w-11 h-11 bg-[#0081c0] rounded-full flex items-center justify-center text-white shadow-[0_4px_12px_rgba(0,129,192,0.3)] ml-auto cursor-pointer">
                    <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <line x1="22" y1="2" x2="11" y2="13" />
                      <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                  </div>
                </div>
              )}

            </div>
          </div>

          {/* Subtitle instructions */}
          {timelineState !== 'morphing' && timelineState !== 'completed' && (
            <div className="absolute bottom-[32vh] flex flex-col items-center gap-2">
              <h2 className="font-serif text-[#fefffc] text-xl font-light tracking-[0.15em] uppercase">
                Enter Nyaya
              </h2>
              <p className="font-sans text-xs text-white/40 tracking-[0.08em] uppercase">
                Click the scales of justice to unlock RAG Legal AI
              </p>
            </div>
          )}

          {/* Vignet Shadow Edge */}
          <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_40%,rgba(6,6,10,0.95)_100%)] pointer-events-none z-1" />
        </div>
      );
    };

    // --- Main Demo Wrapper ---
    const DemoApp = () => {
      const [key, setKey] = useState(0);

      return (
        <div className="relative w-screen h-screen">
          {/* Main Interactive Screen */}
          <CinematicTransition key={key} />

          {/* Replay Controller (Floating pill on bottom-right) */}
          <div className="fixed bottom-6 right-6 z-50">
            <button
              onClick={() => setKey(prev => prev + 1)}
              className="flex items-center gap-2 px-4 py-2 bg-[#1c1c28]/90 border border-white/10 hover:border-white/20 text-[#fefffc] text-xs font-semibold rounded-full shadow-lg backdrop-blur-md transition-all active:scale-95"
            >
              <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
              </svg>
              Replay Transition
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DemoApp />);
  </script>

</body>
</html>
